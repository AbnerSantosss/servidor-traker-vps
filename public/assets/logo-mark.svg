<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TrackServer">
  <!-- Redesenho vetorial do símbolo da marca: a linha de nós que sobe (o
       rastreamento) encontrando o rack de servidor (o servidor próprio). A arte
       original é um PNG com glow, que não recorta limpo sobre fundo claro —
       este mark existe para os lugares pequenos: favicon, topbar, sidebar. -->
  <defs>
    <linearGradient id="tsg" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#tsg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- trilha de nós -->
    <path d="M3 23 L9.5 16.5 L15 20 L23.5 8"/>
    <!-- seta de subida -->
    <path d="M19 7.5 L24 7 L23.5 12"/>
  </g>
  <g fill="url(#tsg)">
    <circle cx="3" cy="23" r="2.4"/>
    <circle cx="9.5" cy="16.5" r="2.4"/>
    <circle cx="15" cy="20" r="2.4"/>
  </g>
  <!-- rack: três lâminas empilhadas -->
  <g fill="none" stroke="url(#tsg)" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 20.5 h7"/>
    <path d="M22 24 h7"/>
    <path d="M22 27.5 h7"/>
  </g>
</svg>
